<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CaseFlow AI</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --ink:#13211e; --muted:#64736f; --line:#dbe3df; --paper:#f7f9f8; --white:#fff; --teal:#007a68; --teal-dark:#005c4f; --amber:#a75b00; --red:#b42318; --blue:#235c91; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.5 Inter, "Microsoft YaHei", sans-serif; color:var(--ink); background:var(--paper); }
    header { height:58px; background:var(--white); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 28px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:17px; } .brand-mark { width:28px; height:28px; display:grid; place-items:center; color:white; background:var(--teal); border-radius:5px; }
    .environment { color:var(--muted); font-size:12px; display:flex; gap:7px; align-items:center; } .dot { width:8px; height:8px; border-radius:50%; background:#2d9d78; }
    main { max-width:1200px; margin:0 auto; padding:28px; } .top { display:flex; justify-content:space-between; align-items:end; margin-bottom:24px; gap:20px; }
    h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0; } .grid { display:grid; grid-template-columns:1fr 1.4fr; gap:20px; }
    section { background:var(--white); border:1px solid var(--line); border-radius:6px; } .section-head { padding:15px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; } h2 { margin:0; font-size:15px; }
    .form { padding:18px; display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { color:var(--muted); font-size:12px; display:grid; gap:5px; } label.full { grid-column:1/-1; }
    input, textarea, select { width:100%; font:inherit; padding:9px 10px; border:1px solid #b8c8c2; border-radius:4px; color:var(--ink); background:white; } textarea { min-height:104px; resize:vertical; }
    button { display:inline-flex; align-items:center; gap:7px; font:inherit; border:0; border-radius:4px; padding:9px 12px; cursor:pointer; background:var(--teal); color:white; } button:hover { background:var(--teal-dark); } button.secondary { background:white; color:var(--teal-dark); border:1px solid #9ebdb5; } button:disabled { opacity:.55; cursor:not-allowed; }
    .form-actions { grid-column:1/-1; display:flex; justify-content:flex-end; gap:9px; } .queue { min-height:344px; } .empty { color:var(--muted); text-align:center; padding:98px 20px; } .ticket { padding:16px 18px; border-bottom:1px solid var(--line); } .ticket:last-child { border:0; }
    .ticket-line { display:flex; justify-content:space-between; gap:12px; align-items:start; } .ticket-title { font-weight:650; } .ticket-copy { color:var(--muted); margin:5px 0 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .tag { padding:2px 7px; border-radius:3px; background:#e8f3ef; color:#146251; font-size:12px; } .tag.high { background:#fff0e8; color:var(--red); } .tag.medium { background:#fff7df; color:var(--amber); }
    .ticket-actions { display:flex; gap:7px; } .audit { grid-column:1/-1; } .timeline { padding:4px 18px 16px; } .event { display:grid; grid-template-columns:12px 1fr; gap:10px; padding:13px 0 0; } .event-dot { width:8px; height:8px; border-radius:50%; background:var(--teal); margin-top:6px; } .event-name { font-weight:600; } .event-detail, .event-time { color:var(--muted); font-size:12px; }
    .toast { position:fixed; right:24px; bottom:24px; max-width:340px; padding:11px 14px; color:white; background:#21312d; border-radius:5px; opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; } .toast.show { opacity:1; transform:none; } .toast.error { background:#8b1e15; }
    @media (max-width:760px) { header { padding:0 16px; } main { padding:18px 16px; } .top { align-items:start; flex-direction:column; } .grid { grid-template-columns:1fr; } .form { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="brand-mark"><i data-lucide="workflow" size="17"></i></span>CaseFlow AI</div><div class="environment"><span class="dot"></span>合成数据演示环境</div></header>
  <main>
    <div class="top"><div><h1>投诉工单协同台</h1><p class="sub">风险分流、SOP 依据、人工审批与 CRM 投递审计</p></div><button class="secondary" id="sample"><i data-lucide="wand-sparkles" size="16"></i>填充退款案例</button></div>
    <div class="grid">
      <section><div class="section-head"><h2>新建工单</h2><span class="tag">Idempotent</span></div><form class="form" id="ticket-form">
        <label>客户标识<input id="customer" value="synthetic-customer-01" required></label><label>来源<select id="channel"><option>web</option><option>email</option><option>phone</option></select></label>
        <label class="full">主题<input id="subject" placeholder="例如：退款投诉" required></label><label class="full">问题描述<textarea id="content" placeholder="输入客户反馈内容" required></textarea></label>
        <div class="form-actions"><button type="submit" id="submit"><i data-lucide="send" size="16"></i>创建并分流</button></div>
      </form></section>
      <section class="queue"><div class="section-head"><h2>本次会话工单</h2><span id="count" class="tag">0</span></div><div id="tickets"><div class="empty">尚未创建工单</div></div></section>
      <section class="audit"><div class="section-head"><h2>审计轨迹</h2><span id="audit-ticket" class="sub">选择一张工单查看</span></div><div id="audit"><div class="empty">审计事件会按状态流转实时显示</div></div></section>
    </div>
  </main><div class="toast" id="toast"></div>
  <script>
    const tickets = new Map(); const $ = id => document.getElementById(id); const icon = () => lucide.createIcons(); const apiBase = location.pathname.startsWith('/caseflow') ? '/caseflow' : '';
    function notice(text, error=false) { const t=$('toast'); t.textContent=text; t.className='toast show'+(error?' error':''); setTimeout(()=>t.className='toast', 2800); }
    function tag(ticket) { return `<span class="tag ${ticket.priority === 'critical' || ticket.priority === 'high' ? 'high' : ticket.priority === 'medium' ? 'medium':''}">${ticket.priority}</span>`; }
    function render() { const list=[...tickets.values()]; $('count').textContent=list.length; $('tickets').innerHTML=list.length ? list.map(t=>`<article class="ticket"><div class="ticket-line"><div><div class="ticket-title">${escapeHtml(t.subject || t.category)} ${tag(t)}</div><div class="ticket-copy">${escapeHtml(t.draft_reply)}</div><div class="meta"><span class="tag">${t.category}</span><span class="tag">${t.status}</span><span class="tag">${t.sop_citations[0]}</span></div></div><div class="ticket-actions">${t.status==='pending_review'?`<button onclick="approve('${t.id}')" title="批准并进入投递队列"><i data-lucide="check" size="16"></i></button>`:''}<button class="secondary" onclick="audit('${t.id}')" title="查看审计记录"><i data-lucide="scroll-text" size="16"></i></button></div></div></article>`).join('') : '<div class="empty">尚未创建工单</div>'; icon(); }
    function escapeHtml(s) { const x=document.createElement('div'); x.textContent=s||''; return x.innerHTML; }
    async function audit(id) { const res=await fetch(`${apiBase}/tickets/${id}/audit`); const rows=await res.json(); $('audit-ticket').textContent=`工单 ${id.slice(0,8)}`; $('audit').innerHTML=`<div class="timeline">${rows.map(e=>`<div class="event"><span class="event-dot"></span><div><div class="event-name">${e.event_type}</div><div class="event-detail">${escapeHtml(JSON.stringify(e.payload))}</div><div class="event-time">${e.actor} · ${new Date(e.created_at).toLocaleString()}</div></div></div>`).join('')}</div>`; }
    async function approve(id) { const endpoint=apiBase?`${apiBase}/demo/tickets/${id}/approve`:`${apiBase}/tickets/${id}/review`; const options=apiBase?{method:'POST'}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision:'approve',reviewer:'demo-reviewer',note:'演示审核通过'})}; const res=await fetch(endpoint,options); if(!res.ok) return notice('演示审批暂不可用',true); const ticket=await res.json(); tickets.set(id,{...tickets.get(id),...ticket}); render(); notice('审核完成，等待 worker 投递'); setTimeout(async()=>{ const fresh=await (await fetch(`${apiBase}/tickets/${id}`)).json(); tickets.set(id,{...tickets.get(id),...fresh}); render(); audit(id); },2500); }
    $('sample').onclick=()=>{ $('subject').value='退款投诉'; $('content').value='商品破损，我要求退款并准备投诉。'; $('customer').value='synthetic-customer-01'; };
    $('ticket-form').onsubmit=async e=>{ e.preventDefault(); const button=$('submit'); button.disabled=true; const body={customer_id:$('customer').value,subject:$('subject').value,content:$('content').value,channel:$('channel').value}; try { const res=await fetch(`${apiBase}/tickets`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(body)}); if(!res.ok) throw new Error(); const ticket=await res.json(); tickets.set(ticket.id,{...ticket,subject:body.subject}); render(); audit(ticket.id); notice(ticket.requires_human_review?'已进入人工审核队列':'低风险工单已自动进入投递队列'); } catch { notice('创建工单失败',true); } finally { button.disabled=false; } };
    icon();
  </script>
</body>
</html>
