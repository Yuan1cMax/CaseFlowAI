<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ServiceOps AI | 客服质检与投诉协同</title>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { --ink:#14201e; --muted:#62716d; --line:#d8e1de; --paper:#f4f7f6; --white:#fff; --teal:#007a68; --teal-soft:#e8f4f0; --amber:#a15a00; --amber-soft:#fff5e5; --red:#b42318; --red-soft:#fff0ee; --blue:#235c91; }
    * { box-sizing:border-box; } body { margin:0; font:14px/1.5 Inter,"Microsoft YaHei",sans-serif; color:var(--ink); background:var(--paper); }
    button,input,textarea,select { font:inherit; } button { cursor:pointer; } header { height:60px; display:flex; align-items:center; justify-content:space-between; padding:0 30px; background:#10211d; color:#fff; }
    .brand { display:flex; align-items:center; gap:10px; font-size:16px; font-weight:760; } .brand-mark { display:grid; place-items:center; width:30px; height:30px; color:#10211d; background:#a9e2d4; border-radius:5px; } .brand small { color:#99aaa4; font-weight:500; }
    .environment { display:flex; align-items:center; gap:8px; color:#b3c0bb; font-size:12px; } .dot { width:8px; height:8px; border-radius:50%; background:#5ed0ad; box-shadow:0 0 0 4px rgba(94,208,173,.12); }
    main { width:min(1320px,calc(100% - 48px)); margin:0 auto; padding:30px 0 50px; } .top { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:26px; } .eyebrow { display:flex; gap:8px; align-items:center; margin:0 0 7px; color:var(--teal); font-size:11px; font-weight:700; } h1 { margin:0; font-size:27px; letter-spacing:0; } .sub { margin:7px 0 0; color:var(--muted); }
    .actions { display:flex; gap:10px; } button { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:38px; padding:0 12px; border:1px solid transparent; border-radius:5px; background:var(--teal); color:#fff; font-weight:650; } button:hover { background:#006456; } button.secondary { background:#fff; color:var(--teal); border-color:#a7c8bf; } button.secondary:hover { background:#f4fbf8; } button:disabled { opacity:.55; cursor:not-allowed; }
    .metrics { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px; } .metric { min-height:105px; padding:17px; background:var(--white); border:1px solid var(--line); border-radius:6px; } .metric label { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:12px; } .metric strong { display:block; margin-top:9px; font-size:27px; line-height:1; } .metric.review strong { color:var(--amber); } .metric.risk strong { color:var(--red); } .metric.done strong { color:var(--teal); }
    .board { display:grid; grid-template-columns:minmax(420px,1.05fr) minmax(420px,.95fr); gap:18px; align-items:start; } .panel { overflow:hidden; background:var(--white); border:1px solid var(--line); border-radius:6px; } .panel-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:55px; padding:0 17px; border-bottom:1px solid var(--line); } h2 { margin:0; font-size:15px; } .hint { color:var(--muted); font-size:12px; } .queue { max-height:610px; overflow:auto; }
    .ticket { display:grid; grid-template-columns:5px minmax(0,1fr) auto; gap:13px; align-items:start; padding:15px 17px; border-bottom:1px solid var(--line); cursor:pointer; } .ticket:hover,.ticket.active { background:#f7fbf9; } .ticket:last-child { border-bottom:0; } .stripe { width:5px; min-height:55px; border-radius:4px; background:#9dbbb3; } .stripe.high,.stripe.critical { background:var(--red); } .stripe.medium { background:var(--amber); } .ticket-title { font-weight:730; } .ticket-copy { overflow:hidden; margin-top:4px; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; } .meta { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; } .tag { display:inline-flex; align-items:center; gap:4px; padding:2px 7px; border-radius:3px; color:#156452; background:var(--teal-soft); font-size:11px; } .tag.high,.tag.critical { color:var(--red); background:var(--red-soft); } .tag.medium { color:var(--amber); background:var(--amber-soft); } .time { margin-top:3px; color:#87938f; font-size:11px; white-space:nowrap; }
    .detail { min-height:610px; } .empty { display:grid; min-height:400px; place-items:center; padding:30px; color:var(--muted); text-align:center; } .detail-body { padding:19px; } .detail-title { display:flex; justify-content:space-between; gap:10px; align-items:start; } .detail-title h3 { margin:0; font-size:19px; } .detail-copy { margin:11px 0 16px; color:#4d5d58; line-height:1.75; } .signal { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:16px 0; } .signal div { padding:10px; background:#f5f8f7; border-left:3px solid var(--teal); } .signal div:nth-child(2) { border-color:var(--amber); } .signal div:nth-child(3) { border-color:var(--blue); } .signal span { display:block; color:var(--muted); font-size:11px; } .signal strong { display:block; margin-top:2px; font-size:13px; overflow-wrap:anywhere; }
    .block { margin-top:15px; padding:13px; border:1px solid var(--line); border-radius:5px; } .block-label { display:flex; align-items:center; gap:7px; margin-bottom:7px; color:var(--muted); font-size:11px; font-weight:700; } .block p { margin:0; line-height:1.65; } .sop { color:#0d6c5c; font-weight:700; } .detail-actions { display:flex; gap:9px; margin-top:17px; } .timeline { margin-top:16px; padding-top:15px; border-top:1px solid var(--line); } .event { display:grid; grid-template-columns:12px 1fr; gap:8px; margin-top:9px; font-size:12px; } .event-dot { width:7px; height:7px; margin-top:5px; border-radius:50%; background:var(--teal); } .event-name { font-weight:650; } .event-meta { margin-top:2px; color:var(--muted); font-size:11px; }
    .composer { grid-column:1/-1; } .form { display:grid; grid-template-columns:1fr 1fr 1.5fr auto; gap:10px; padding:15px 17px; } input,textarea,select { width:100%; border:1px solid #b8c8c2; border-radius:4px; padding:9px; color:var(--ink); background:#fff; } textarea { min-height:39px; resize:vertical; }
    .toast { position:fixed; right:22px; bottom:22px; z-index:10; max-width:340px; padding:11px 14px; border-radius:5px; color:#fff; background:#1d312b; opacity:0; transform:translateY(10px); transition:.18s; pointer-events:none; } .toast.show { opacity:1; transform:none; } .toast.error { background:#8b1e15; }
    @media(max-width:860px) { header { padding:0 18px; } .brand small { display:none; } main { width:min(100% - 28px,1320px); padding-top:20px; } .top { align-items:start; flex-direction:column; } .metrics { grid-template-columns:repeat(2,1fr); } .board { grid-template-columns:1fr; } .detail { min-height:0; } .form { grid-template-columns:1fr; } .form button { min-height:42px; } .signal { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="brand"><span class="brand-mark"><i data-lucide="scan-search" size="17"></i></span>ServiceOps AI <small>/ 客服质检与投诉协同</small></div>
    <div class="environment"><span class="dot"></span>合成案例演示环境</div>
  </header>
  <main>
    <div class="top">
      <div><p class="eyebrow"><i data-lucide="shield-check" size="14"></i> AI-ASSISTED SERVICE OPERATIONS</p><h1>风险分流、SOP 协同与人工处置闭环</h1><p class="sub">面向客服主管的工作台：先识别高风险，再由人决定是否进入跨系统投递。</p></div>
      <div class="actions"><button class="secondary" id="reload"><i data-lucide="refresh-cw" size="15"></i>刷新看板</button><button id="seed"><i data-lucide="database-zap" size="15"></i>加载 10 条演示案例</button></div>
    </div>
    <section class="metrics" aria-label="运营指标">
      <div class="metric"><label>合成案例 <i data-lucide="inbox" size="15"></i></label><strong id="total">0</strong></div>
      <div class="metric review"><label>待人工审核 <i data-lucide="user-round-check" size="15"></i></label><strong id="review">0</strong></div>
      <div class="metric risk"><label>高风险 / 紧急 <i data-lucide="triangle-alert" size="15"></i></label><strong id="risk">0</strong></div>
      <div class="metric done"><label>已投递 CRM <i data-lucide="send" size="15"></i></label><strong id="delivered">0</strong></div>
    </section>
    <div class="board">
      <section class="panel"><div class="panel-head"><h2>风险处理队列</h2><span class="hint" id="scope">仅展示合成数据</span></div><div class="queue" id="queue"><div class="empty">正在读取演示队列...</div></div></section>
      <section class="panel detail"><div class="panel-head"><h2>处置决策台</h2><span class="hint">人工审核优先</span></div><div id="detail"><div class="empty">从左侧选择一个案例，查看风险依据、SOP 和审计轨迹。</div></div></section>
      <section class="panel composer"><div class="panel-head"><h2>创建合成案例</h2><span class="hint">仅用于演示，不进入真实业务系统</span></div><form class="form" id="composer"><input id="subject" required placeholder="主题，例如：退款投诉"><textarea id="content" required placeholder="客户反馈，例如：商品破损，要求退款并准备投诉"></textarea><select id="channel"><option value="web">Web</option><option value="email">Email</option><option value="phone">Phone</option></select><button type="submit"><i data-lucide="sparkles" size="15"></i>分析并分流</button></form></section>
    </div>
  </main>
  <div class="toast" id="toast"></div>
  <script>
    const $ = id => document.getElementById(id); const icon = () => lucide.createIcons(); const apiBase = location.pathname.startsWith('/caseflow') ? '/caseflow' : ''; let state = { tickets: [], selected: null };
    function notice(text, error=false) { const t=$('toast'); t.textContent=text; t.className='toast show'+(error?' error':''); setTimeout(()=>t.className='toast',2800); }
    function escapeHtml(value) { const node=document.createElement('div'); node.textContent=value || ''; return node.innerHTML; }
    function label(value) { return ({pending_review:'待审核',approved:'待投递',rejected:'已拒绝',delivered:'已投递',delivery_failed:'投递失败',critical:'紧急',high:'高风险',medium:'中风险',low:'低风险'})[value] || value; }
    function tag(value) { return `<span class="tag ${value}">${escapeHtml(label(value))}</span>`; }
    function render() { const c=state.counts || {}; const p=state.priorities || {}; $('total').textContent=state.tickets.length; $('review').textContent=c.pending_review || 0; $('risk').textContent=(p.high || 0)+(p.critical || 0); $('delivered').textContent=c.delivered || 0; $('scope').textContent=state.scope === 'synthetic-demo-only' ? '仅展示合成数据' : '演示数据';
      $('queue').innerHTML=state.tickets.length ? state.tickets.map(t=>`<article class="ticket ${state.selected===t.id?'active':''}" data-ticket="${t.id}"><span class="stripe ${t.priority}"></span><div><div class="ticket-title">${escapeHtml(t.subject)}</div><div class="ticket-copy">${escapeHtml(t.content_preview)}</div><div class="meta">${tag(t.priority)}${tag(t.status)}<span class="tag">${escapeHtml(t.category)}</span><span class="tag">${escapeHtml(t.sop_citation)}</span></div></div><span class="time">${new Date(t.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span></article>`).join('') : '<div class="empty">尚无案例，点击右上角加载演示数据。</div>';
      document.querySelectorAll('[data-ticket]').forEach(node=>node.onclick=()=>selectTicket(node.dataset.ticket)); if (state.selected) renderDetail(); icon(); }
    async function selectTicket(id) { state.selected=id; render(); await renderDetail(); }
    async function renderDetail() { const ticket=state.tickets.find(item=>item.id===state.selected); if(!ticket) return; const detail=$('detail'); detail.innerHTML=`<div class="detail-body"><div class="detail-title"><div><h3>${escapeHtml(ticket.subject)}</h3><p class="sub">${tag(ticket.priority)} ${tag(ticket.status)} ${tag(ticket.category)}</p></div><span class="hint">置信度 ${Math.round(ticket.confidence*100)}%</span></div><p class="detail-copy">${escapeHtml(ticket.content_preview)}</p><div class="signal"><div><span>风险判断</span><strong>${escapeHtml(ticket.review_reason || '常规流程')}</strong></div><div><span>SOP 依据</span><strong>${escapeHtml(ticket.sop_citation)}</strong></div><div><span>渠道</span><strong>${escapeHtml(ticket.channel)}</strong></div></div><div class="block"><div class="block-label"><i data-lucide="book-open-check" size="14"></i> SOP 引用与处置边界</div><p><span class="sop">${escapeHtml(ticket.sop_citation)}</span> 已关联到该案例；涉及退款、赔偿、投诉、舆情或欺诈时，系统不自动对外承诺，转入人工审核。</p></div><div class="block"><div class="block-label"><i data-lucide="message-square-text" size="14"></i> AI 草拟回复</div><p>${escapeHtml(ticket.draft_reply)}</p></div>${ticket.status==='pending_review'?`<div class="detail-actions"><button id="approve"><i data-lucide="check-check" size="15"></i>批准并进入投递队列</button></div>`:''}<div class="timeline" id="timeline"><div class="hint">正在读取审计记录...</div></div></div>`; icon(); if(ticket.status==='pending_review') $('approve').onclick=()=>approve(ticket.id); try { const res=await fetch(`${apiBase}/tickets/${ticket.id}/audit`); const events=await res.json(); $('timeline').innerHTML='<div class="block-label"><i data-lucide="history" size="14"></i> 可回放审计轨迹</div>'+events.map(e=>`<div class="event"><span class="event-dot"></span><div><div class="event-name">${escapeHtml(e.event_type)}</div><div class="event-meta">${escapeHtml(e.actor)} · ${new Date(e.created_at).toLocaleString()}</div></div></div>`).join(''); icon(); } catch { $('timeline').innerHTML='<div class="hint">审计记录暂不可用</div>'; } }
    async function refresh(selectFirst=false) { try { const res=await fetch(`${apiBase}/dashboard/summary`); if(!res.ok) throw new Error(); state=await res.json(); if(selectFirst || !state.tickets.some(ticket=>ticket.id===state.selected)) state.selected=state.tickets[0]?.id || null; render(); if(state.selected) await renderDetail(); } catch { notice('读取演示看板失败',true); } }
    async function seed() { const button=$('seed'); button.disabled=true; try { const res=await fetch(`${apiBase}/demo/seed`,{method:'POST'}); if(!res.ok) throw new Error(); await refresh(true); notice('已加载可复现的 10 条合成案例'); } catch { notice('演示案例加载失败',true); } finally { button.disabled=false; } }
    async function approve(id) { try { const res=await fetch(`${apiBase}/demo/tickets/${id}/approve`,{method:'POST'}); if(!res.ok) throw new Error(); notice('审核完成，独立 worker 将异步投递'); setTimeout(()=>refresh(),1200); } catch { notice('审批暂不可用',true); } }
    $('reload').onclick=()=>refresh(); $('seed').onclick=seed; $('composer').onsubmit=async event=>{ event.preventDefault(); const button=event.submitter; button.disabled=true; try { const res=await fetch(`${apiBase}/tickets`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({customer_id:'synthetic-manual-'+crypto.randomUUID().slice(0,8),subject:$('subject').value,content:$('content').value,channel:$('channel').value})}); if(!res.ok) throw new Error(); await refresh(); notice('已完成风险分析并加入演示队列'); event.target.reset(); } catch { notice('案例创建失败',true); } finally { button.disabled=false; } };
    icon(); seed();
  </script>
</body>
</html>
